name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  checks: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tag must match manifests
        run: node scripts/version.mjs check "${GITHUB_REF_NAME}"

  require-ci:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - name: Require green CI checks on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: python3 scripts/require-ci-checks.py

  build-frontend:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack frontend dist
        run: |
          test -d frontend/dist
          tar -C frontend -czf "portreveal-${GITHUB_REF_NAME}-frontend-dist.tar.gz" dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: portreveal-*-frontend-dist.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [verify-version, require-ci, build-frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog-section.py "$TAG" > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARTIFACT="portreveal-${TAG}-frontend-dist.tar.gz"
          test -f "$ARTIFACT"
          # If this tag already has a non-draft release (e.g. manual first release),
          # only attach/replace the frontend artifact.
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$draft" = "false" ]; then
              echo "release ${TAG} already exists; uploading artifact only"
              gh release upload "$TAG" "$ARTIFACT" --clobber
              exit 0
            fi
          fi
          gh release create "$TAG" "$ARTIFACT" \
            --title "PortReveal ${TAG#v}" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest \
            --verify-tag
