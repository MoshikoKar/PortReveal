name: Schema drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET_KEY: schema-drift-check
      DATABASE_URL: sqlite:///./schema-check.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check

  # Production uses PostgreSQL (see README). Catch dialect-specific migration bugs
  # (e.g. boolean binds) that SQLite silently accepts.
  alembic-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portreveal
          POSTGRES_PASSWORD: portreveal
          POSTGRES_DB: portreveal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portreveal -d portreveal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET_KEY: schema-drift-check
      DATABASE_URL: postgresql+psycopg://portreveal:portreveal@127.0.0.1:5432/portreveal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # Upgrade / downgrade / upgrade catches dialect-specific migration bugs (e.g. boolean
      # binds). Full model↔DB drift stays on the SQLite alembic-check job — Postgres also
      # surfaces pre-existing UniqueConstraint naming noise (vuln_jobs_uuid_key) unrelated
      # to recipient groups.
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
