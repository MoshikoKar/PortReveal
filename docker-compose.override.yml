# Optional local override (auto-loaded when you omit -f).
# The base docker-compose.yml already uses bridge networking and publishes APP_PORT,
# so this file only reinforces that for `docker compose up` without -f.
#
#   docker compose --env-file .env.production up -d --build
#   docker compose -f docker-compose.yml --env-file .env.production up -d --build
#
# Linux host with real LAN ARP/MAC (host networking):
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml --env-file .env.production up -d --build
#
# On the bridge network the app reaches Postgres as hostname "db" on container
# port 5432. POSTGRES_PORT in .env.production only controls the host mapping on db.
# Scans leave through the host via NAT: routed TCP/ICMP works, but MAC addresses
# are not visible. Windows Firewall must allow inbound TCP on APP_PORT.

services:
  app:
    ports:
      - "${APP_PORT:-8081}:${APP_PORT:-8081}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
