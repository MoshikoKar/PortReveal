[project]
name = "network-finder-backend"
version = "1.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e (browser) tests are opt-in: `npm run test:e2e` builds the frontend and passes -m e2e.
addopts = "-p no:cacheprovider -m 'not e2e'"
markers = ["e2e: end-to-end browser tests against the built frontend (npm run test:e2e)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using .httpx. with .starlette.testclient.:Warning"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in argument defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
