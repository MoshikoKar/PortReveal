# Default Compose stack (bridge network + published APP_PORT).
# Works on Docker Desktop (Windows/macOS) and any Linux host:
#   docker compose -f docker-compose.yml --env-file .env.production up -d --build
#   (or: docker compose --env-file .env.production up -d --build)
#
# For real LAN ARP/MAC discovery on a Linux Docker host, also load the linux overlay:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml --env-file .env.production up -d --build
#
# Build-time egress: allow storage.googleapis.com:443 (Playwright Chromium),
# or set HTTP_PROXY / HTTPS_PROXY in .env.production if builds go through a proxy.
#
# APP_PORT and POSTGRES_PORT come from the env file (e.g. 8081 / 5434).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netfinder}
      POSTGRES_USER: ${POSTGRES_USER:-netfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production (or .env)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"   # host mapping; container always listens on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    image: network-finder:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:${APP_PORT:-8081}"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_PORT: ${APP_PORT:-8081}
      # Bridge network: reach Postgres by service name on the container port.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-netfinder}
      POSTGRES_USER: ${POSTGRES_USER:-netfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production (or .env)}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      SCANNER_MODE: ${SCANNER_MODE:-nmap}
      NMAP_PRIVILEGED: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-480}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-24}
      TZ: ${TZ:-UTC}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
